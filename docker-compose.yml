# Ymmo — full stack in containers.
# Launch everything with:  docker compose up --build
# Override any value by creating a .env file next to this file (see .env.example).

services:
  # ---------- MariaDB ----------
  db:
    image: mariadb:11.4
    container_name: ymmo-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Passed through so the init script can create the read-only AI user.
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Run on first startup (empty data volume), in alphabetical order:
      #   01 schema → 02 reference data → 03 read-only AI user → 04 demo seed.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/reference-data.sql:/docker-entrypoint-initdb.d/02-reference-data.sql:ro
      - ./db/init-ai-user.sh:/docker-entrypoint-initdb.d/03-ai-user.sh:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    networks:
      - api_db
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Go API ----------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ymmo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # API starts only once the DB is ready
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db # service name on the compose network
      DB_PORT: "3306"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Internal URL of the Python AI service (proxied via /api/v1/ai/*).
      AI_BASE_URL: http://ai:8000
      # Property photo uploads: on-disk dir (a volume) + public URL to build links.
      UPLOAD_DIR: /app/uploads
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    volumes:
      - uploads:/app/uploads
    networks:
      - front_api
      - api_db
    ports:
      - "8080:8080"

  # ---------- Python Data/AI service ----------
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ymmo-ai
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db # service name on the compose network
      DB_PORT: "3306"
      # Read-only AI user (no fallback).
      DB_USER: ${AI_DB_USER}
      DB_PASSWORD: ${AI_DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - api_db
    # No public port: the AI service is reachable ONLY on the internal Docker
    # network (e.g. by the Go API at http://ai:8000). It is never exposed on
    # localhost:8000.
    expose:
      - "8000"

  # ---------- Front-end (static, served by nginx) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ymmo-front
    restart: unless-stopped
    depends_on:
      - api # not a hard dependency (the browser calls the API), just ordering
    networks:
      - front_api
    ports:
      # Browse the app at http://localhost:3000
      - "3001:80"

volumes:
  db_data:
    # Explicit name so the volume is stable regardless of the project folder
    # name (otherwise Docker prefixes it, e.g. "<folder>_db_data").
    name: ymmo_db_data
  uploads:
    # Stores uploaded property photos, persisted across container rebuilds.
    name: ymmo_uploads

networks:
  front_api:
    name: ymmo_front_api
  api_db:
    name: ymmo_api_db
