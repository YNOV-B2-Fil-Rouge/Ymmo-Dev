<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ymmo — Dashboard Direction</title>
  <meta name="description" content="Tableau de bord du directeur d'agence Ymmo." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="bg-alyssum text-midnight font-sans antialiased min-h-screen flex flex-col">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-hibiscus focus:text-white focus:px-4 focus:py-2 focus:rounded">Aller au contenu</a>

  <header class="bg-alyssum border-b-2 border-hibiscus">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2 text-midnight" aria-label="Accueil Ymmo">
        <span class="text-hibiscus" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 100 100" fill="none">
            <path d="M22 46 L50 22 L78 46" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M30 44 V80 M70 44 V80" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".55"/>
            <path d="M37 44 L50 60 L63 44 M50 60 V82" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="text-xl font-bold tracking-wider">YMMO</span>
      </a>
      <a href="./profile.html" title="Mon profil" aria-label="Mon profil"
         class="w-9 h-9 rounded-full border border-hibiscus text-hibiscus flex items-center justify-center hover:bg-hibiscus hover:text-white transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.5 3.6-6 8-6s8 2.5 8 6"/></svg>
      </a>
    </div>
  </header>

  <main id="main" class="flex-1 max-w-6xl mx-auto w-full px-4 py-10">
    <div class="grid md:grid-cols-[260px_1fr] gap-8">

      <aside class="md:border-r border-hibiscus/30 md:pr-8">
        <h1 class="text-2xl font-bold mb-6">Dashboard :</h1>
        <nav class="space-y-3" aria-label="Sections du dashboard">
          <button data-tab="perf" class="dash-tab w-full border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg transition-colors">Performance agence</button>
          <button data-tab="biens" class="dash-tab w-full border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg transition-colors">Gestion des biens</button>
          <button data-tab="ia" class="dash-tab w-full border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg transition-colors">Analyse stratégique IA</button>
          <button data-tab="annuaire" class="dash-tab w-full border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg transition-colors">Annuaire collaborateurs</button>
          <a href="./messages.html" class="block w-full text-center border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg hover:bg-hibiscus hover:text-white transition-colors">Messagerie</a>
        </nav>
      </aside>

      <section>
        <div id="panel-perf" class="panel hidden">
          <h2 id="perf-title" class="text-2xl font-bold mb-6">Performance agence</h2>
          <div id="kpi-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>
          <div class="mt-8 border border-hibiscus/20 rounded-xl bg-white p-4 max-w-md">
            <h3 class="font-semibold text-hibiscus mb-3">Répartition des biens par statut</h3>
            <div class="h-64"><canvas id="kpi-chart" aria-hidden="true"></canvas></div>
          </div>
        </div>

        <div id="panel-biens" class="panel">
          <div class="flex items-center justify-between mb-6">
            <h2 id="biens-title" class="text-2xl font-bold">Gestion des biens</h2>
            <a href="./property-form.html" class="bg-hibiscus hover:bg-hibiscus/90 text-white text-sm font-medium px-4 py-2 rounded-md transition-colors">+ Publier un bien</a>
          </div>
          <div id="agencies-overview" class="hidden mb-8"></div>
          <div id="biens-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="panel-ia" class="panel hidden">
          <h2 class="text-2xl font-bold mb-6">Analyse stratégique IA</h2>
          <div id="ia-body" class="space-y-8"></div>
        </div>

        <div id="panel-annuaire" class="panel hidden">
          <h2 class="text-2xl font-bold mb-6">Annuaire collaborateurs</h2>
          <div id="collab-table" class="overflow-x-auto"></div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/dashboard-director.js"></script>
</body>
</html>
