<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ymmo - Dashboard IT</title>
  <link rel="icon" type="image/png" href="./img/logo.png" />
  <meta name="description" content="Administration IT de la plateforme Ymmo." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="bg-alyssum text-midnight font-sans antialiased min-h-screen flex flex-col">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-hibiscus focus:text-white focus:px-4 focus:py-2 focus:rounded">Aller au contenu</a>

  <header class="bg-alyssum border-b-2 border-hibiscus">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2 text-midnight" aria-label="Accueil Ymmo">
        <img src="./img/logo-title.png" alt="Ymmo" class="h-12 w-auto" />
      </a>
      <a href="./profile.html" title="Mon profil" aria-label="Mon profil"
         class="w-9 h-9 rounded-full border border-hibiscus text-hibiscus flex items-center justify-center hover:bg-hibiscus hover:text-white transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.5 3.6-6 8-6s8 2.5 8 6"/></svg>
      </a>
    </div>
  </header>

  <main id="main" class="flex-1 max-w-6xl mx-auto w-full px-4 py-10">
    <div class="grid md:grid-cols-[260px_1fr] gap-8">

      <aside class="md:border-r border-hibiscus/30 md:pr-8">
        <h1 class="text-2xl font-bold mb-6">Dashboard :</h1>
        <nav class="space-y-3" aria-label="Sections du dashboard">
          <button data-tab="users" class="dash-tab w-full border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg transition-colors">Gestion des utilisateurs</button>
          <button data-tab="matrix" class="dash-tab w-full border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg transition-colors">Matrice des droits</button>
          <button data-tab="monitoring" class="dash-tab w-full border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg transition-colors">Monitoring</button>
          <button data-tab="annuaire" class="dash-tab w-full border border-hibiscus text-hibiscus font-semibold py-3 rounded-lg transition-colors">Annuaire collaborateurs</button>
        </nav>
      </aside>

      <section>
        <div id="panel-users" class="panel hidden">
          <h2 class="text-2xl font-bold mb-6">Gestion des utilisateurs</h2>
          <div id="users-table" class="overflow-x-auto"></div>
        </div>

        <div id="panel-matrix" class="panel">
          <h2 class="text-2xl font-bold mb-6">Matrice des droits</h2>
          <div id="matrix-table" class="overflow-x-auto"></div>
        </div>

        <div id="panel-monitoring" class="panel hidden">
          <h2 class="text-2xl font-bold mb-6">Monitoring</h2>
          <div id="monitoring-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>

          <h3 class="font-semibold text-hibiscus mt-8 mb-3">Liens techniques</h3>
          <div class="flex flex-wrap gap-3">
            <a id="swagger-link" href="#" target="_blank" rel="noopener"
               class="text-sm font-medium border border-hibiscus text-hibiscus hover:bg-hibiscus hover:text-white px-4 py-2 rounded-md transition-colors">
              Documentation API (Swagger UI)
            </a>
            <button id="ping-btn" class="text-sm font-medium border border-hibiscus text-hibiscus hover:bg-hibiscus hover:text-white px-4 py-2 rounded-md transition-colors">
              Tester l'API (/ping)
            </button>
            <span id="ping-result" class="text-sm self-center"></span>
          </div>
        </div>

        <div id="panel-annuaire" class="panel hidden">
          <h2 class="text-2xl font-bold mb-6">Annuaire collaborateurs</h2>
          <div id="collab-table" class="overflow-x-auto"></div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/dashboard-it.js"></script>
</body>
</html>
