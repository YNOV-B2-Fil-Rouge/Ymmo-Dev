<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ymmo — Messagerie</title>
  <meta name="description" content="Vos conversations Ymmo." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="bg-alyssum text-midnight font-sans antialiased h-screen flex flex-col overflow-hidden">
  <a href="#conversations" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-hibiscus focus:text-white focus:px-4 focus:py-2 focus:rounded">Aller aux conversations</a>

  <header class="bg-alyssum border-b-2 border-hibiscus shrink-0">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2 text-midnight" aria-label="Accueil Ymmo">
        <span class="text-hibiscus" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 100 100" fill="none">
            <path d="M22 46 L50 22 L78 46" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M30 44 V80 M70 44 V80" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".55"/>
            <path d="M37 44 L50 60 L63 44 M50 60 V82" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="text-xl font-bold tracking-wider">YMMO</span>
      </a>
      <a href="./profile.html" title="Mon profil" aria-label="Mon profil"
         class="w-9 h-9 rounded-full border border-hibiscus text-hibiscus flex items-center justify-center hover:bg-hibiscus hover:text-white transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.5 3.6-6 8-6s8 2.5 8 6"/></svg>
      </a>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 grid md:grid-cols-[300px_1fr] gap-6 overflow-hidden">

    <aside id="conversations" class="md:border-r border-hibiscus/30 md:pr-6 overflow-y-auto">
      <h1 class="text-2xl font-bold mb-5">Conversations :</h1>
      <p id="unread-badge" class="hidden text-sm text-hibiscus font-semibold mb-3" role="status"></p>
      <ul id="conv-list" class="space-y-3"></ul>
      <p id="conv-empty" class="hidden text-slate2">Aucune conversation pour le moment.</p>
    </aside>

    <section class="flex flex-col overflow-hidden">
      <div id="conv-header" class="hidden border border-hibiscus/40 rounded-lg px-4 py-3 font-semibold mb-4 shrink-0"></div>

      <div id="messages" class="flex-1 overflow-y-auto space-y-3 pr-1">
        <p id="messages-placeholder" class="text-slate2 text-center mt-10">Sélectionnez une conversation pour afficher les messages.</p>
      </div>

      <form id="send-form" class="hidden mt-4 flex items-center gap-2 bg-white rounded-full border border-slate2/30 shadow pl-5 pr-2 py-2 shrink-0">
        <label for="message-input" class="sr-only">Votre message</label>
        <input id="message-input" name="body" type="text" autocomplete="off" required placeholder="Écrivez votre message ici…"
               class="flex-1 bg-transparent text-sm focus:outline-none placeholder-slate2" />
        <button type="submit" class="w-10 h-10 shrink-0 rounded-full border border-hibiscus text-hibiscus flex items-center justify-center hover:bg-hibiscus hover:text-white transition-colors" aria-label="Envoyer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="./js/messages.js"></script>
</body>
</html>
