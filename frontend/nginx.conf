server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Multi-page static site: serve the file if it exists, else 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Light caching for JS modules (no fingerprinting here, so keep it short).
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
