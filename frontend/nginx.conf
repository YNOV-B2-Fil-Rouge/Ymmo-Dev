# Front-end served by nginx, which also reverse-proxies the API on the SAME
# origin. The browser only ever talks to this host -> no hard-coded API URL,
# no CORS, and the API container's port does not need to be public.
upstream ymmo_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Reverse proxy to the Go API (^~ so these win over the asset regex) ----
    location ^~ /api/ {
        proxy_pass http://ymmo_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health    { proxy_pass http://ymmo_api; }
    location ^~ /uploads/ { proxy_pass http://ymmo_api; }
    location ^~ /swagger/ { proxy_pass http://ymmo_api; }

    # ---- Static multi-page site ----
    location / {
        try_files $uri $uri/ =404;
    }

    # Light caching for static assets (no fingerprinting here, so keep it short).
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
