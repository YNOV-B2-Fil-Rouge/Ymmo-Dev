<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ymmo — Connexion / Inscription</title>
  <meta name="description" content="Connectez-vous ou créez votre compte Ymmo." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="bg-alyssum text-midnight font-sans antialiased h-screen overflow-hidden flex flex-col">
  <a href="#card"
    class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-hibiscus focus:text-white focus:px-4 focus:py-2 focus:rounded">Aller
    au formulaire</a>

  <header class="bg-alyssum border-b-2 border-hibiscus shrink-0">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center">
      <a href="./index.html" class="flex items-center gap-2 text-midnight" aria-label="Accueil Ymmo">
        <img src="./img/logo-title.png" alt="Ymmo" class="h-10 w-auto" />
      </a>
    </div>
  </header>

  <main class="relative flex-1 flex items-center overflow-hidden">
    <div class="absolute inset-0 bg-midnight bg-cover bg-center" style="background-image:url('./img/hero.jpg')"
      aria-hidden="true"></div>

    <div class="hidden lg:block absolute left-1/4 top-1/2 -translate-x-1/2 -translate-y-1/2" aria-hidden="true">
      <img src="./img/logo.png" alt="" class="w-56 h-auto" />
    </div>

    <div class="relative w-full max-w-6xl mx-auto px-4 flex justify-center lg:justify-end">
      <section id="card" class="w-full max-w-md bg-alyssum/95 backdrop-blur rounded-2xl shadow-xl p-5 sm:p-6"
        aria-labelledby="auth-title">

        <div class="flex justify-center mb-4">
          <div class="inline-flex rounded-full border border-hibiscus p-1 bg-white" role="tablist"
            aria-label="Connexion ou inscription">
            <button id="tab-login" data-tab="login" role="tab" aria-selected="true"
              class="px-6 py-1.5 rounded-full text-xs font-semibold tracking-wide uppercase bg-hibiscus text-white transition-colors">
              Connexion
            </button>
            <button id="tab-register" data-tab="register" role="tab" aria-selected="false"
              class="px-6 py-1.5 rounded-full text-xs font-semibold tracking-wide uppercase text-hibiscus transition-colors">
              Inscription
            </button>
          </div>
        </div>

        <h1 id="auth-title" class="sr-only">Connexion ou inscription</h1>

        <form id="login-form" novalidate>
          <h2 class="text-xl font-bold text-center mb-4">Connectez-vous</h2>

          <div class="mb-3">
            <label for="login-email" class="block text-hibiscus font-semibold text-sm mb-1">Adresse email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required
              placeholder="john.doe@ymmo.fr"
              class="w-full rounded-md border border-hibiscus/60 bg-white px-3 py-2 text-sm placeholder-slate2/70 focus:outline-none focus:ring-2 focus:ring-hibiscus/40 focus:border-hibiscus" />
          </div>

          <div class="mb-4">
            <label for="login-password" class="block text-hibiscus font-semibold text-sm mb-1">Mot de passe</label>
            <div class="relative">
              <input id="login-password" name="password" type="password" autocomplete="current-password" required
                placeholder="••••••••"
                class="w-full rounded-md border border-hibiscus/60 bg-white px-3 py-2 pr-10 text-sm placeholder-slate2/70 focus:outline-none focus:ring-2 focus:ring-hibiscus/40 focus:border-hibiscus" />
              <button type="button"
                class="toggle-password absolute inset-y-0 right-0 px-3 text-slate2 hover:text-midnight"
                data-target="login-password" aria-label="Afficher le mot de passe">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <p class="login-error hidden mb-3 text-sm text-hibiscus bg-hibiscus/10 border border-hibiscus/30 rounded-md px-3 py-2"
            role="alert"></p>

          <div class="flex justify-center">
            <button type="submit"
              class="border border-hibiscus text-hibiscus hover:bg-hibiscus hover:text-white font-medium px-8 py-2 rounded-full transition-colors">
              Se connecter
            </button>
          </div>
        </form>

        <form id="register-form" class="hidden" novalidate>
          <h2 class="text-xl font-bold text-center mb-4">Inscrivez-vous</h2>

          <div class="mb-3">
            <label for="reg-name" class="block text-hibiscus font-semibold text-sm mb-1">NOM Prénom</label>
            <input id="reg-name" name="name" type="text" autocomplete="name" required placeholder="DOE John"
              class="w-full rounded-md border border-hibiscus/60 bg-white px-3 py-2 text-sm placeholder-slate2/70 focus:outline-none focus:ring-2 focus:ring-hibiscus/40 focus:border-hibiscus" />
          </div>

          <div class="mb-3">
            <label for="reg-phone" class="block text-hibiscus font-semibold text-sm mb-1">Numéro de téléphone</label>
            <input id="reg-phone" name="phone" type="tel" autocomplete="tel" placeholder="+33 6 01 02 03 04"
              class="w-full rounded-md border border-hibiscus/60 bg-white px-3 py-2 text-sm placeholder-slate2/70 focus:outline-none focus:ring-2 focus:ring-hibiscus/40 focus:border-hibiscus" />
          </div>

          <div class="mb-3">
            <label for="reg-email" class="block text-hibiscus font-semibold text-sm mb-1">Adresse email</label>
            <input id="reg-email" name="email" type="email" autocomplete="email" required placeholder="john.doe@ymmo.fr"
              class="w-full rounded-md border border-hibiscus/60 bg-white px-3 py-2 text-sm placeholder-slate2/70 focus:outline-none focus:ring-2 focus:ring-hibiscus/40 focus:border-hibiscus" />
          </div>

          <div class="mb-3">
            <label for="reg-password" class="block text-hibiscus font-semibold text-sm mb-1">Mot de passe</label>
            <div class="relative">
              <input id="reg-password" name="password" type="password" autocomplete="new-password" required
                minlength="8" placeholder="8 caractères minimum"
                class="w-full rounded-md border border-hibiscus/60 bg-white px-3 py-2 pr-10 text-sm placeholder-slate2/70 focus:outline-none focus:ring-2 focus:ring-hibiscus/40 focus:border-hibiscus" />
              <button type="button"
                class="toggle-password absolute inset-y-0 right-0 px-3 text-slate2 hover:text-midnight"
                data-target="reg-password" aria-label="Afficher le mot de passe">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label for="reg-confirm" class="block text-hibiscus font-semibold text-sm mb-1">Confirmation du mot de
              passe</label>
            <div class="relative">
              <input id="reg-confirm" name="confirm" type="password" autocomplete="new-password" required
                placeholder="Répétez le mot de passe"
                class="w-full rounded-md border border-hibiscus/60 bg-white px-3 py-2 pr-10 text-sm placeholder-slate2/70 focus:outline-none focus:ring-2 focus:ring-hibiscus/40 focus:border-hibiscus" />
              <button type="button"
                class="toggle-password absolute inset-y-0 right-0 px-3 text-slate2 hover:text-midnight"
                data-target="reg-confirm" aria-label="Afficher le mot de passe">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <p class="register-error hidden mb-3 text-sm text-hibiscus bg-hibiscus/10 border border-hibiscus/30 rounded-md px-3 py-2"
            role="alert"></p>

          <div class="flex justify-center">
            <button type="submit"
              class="border border-hibiscus text-hibiscus hover:bg-hibiscus hover:text-white font-medium px-8 py-2 rounded-full transition-colors">
              S'inscrire
            </button>
          </div>
        </form>

      </section>
    </div>
  </main>

  <script type="module" src="./js/auth-page.js"></script>
</body>

</html>
